events {
    worker_connections 1024;
}

http {
    # Her servis bir upstream bloğu — nginx buraya yönlendirir
    upstream auth_service {
        server auth-service:8000;
    }
    upstream product_service {
        server product-service:8000;
    }
    upstream order_service {
        server order-service:8000;
    }
    upstream inventory_service {
        server inventory-service:8000;
    }
    upstream log_service {
        server log-service:8000;
    }

    server {
        listen 80;

        # Path-based routing: /api/auth/** → auth-service
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/products/ {
            proxy_pass http://product_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/orders/ {
            proxy_pass http://order_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/inventory/ {
            proxy_pass http://inventory_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SSE endpoint — özel ayarlar gerekli:
        # proxy_buffering off: nginx response'u buffer'lamaz, anında iletir
        # proxy_read_timeout: uzun süre açık kalacak bağlantı için timeout uzatıldı
        # chunked_transfer_encoding: SSE stream'i için
        location /api/logs/ {
            proxy_pass http://log_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }
    }
}
